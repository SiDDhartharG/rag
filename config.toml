# Single place to tune the RAG system. Everything here can be edited without touching code.
# The backend/UI will later read and write this same structure.

[ingest]
strategy = "structure"   # fixed | recursive | sentence | structure | semantic
chunk_tokens = 200
overlap = 40             # only used by "fixed"
collection = "docs"

[retrieval]
top_k = 4                # how many chunks to send to the LLM
min_score = 0.15         # chunks scoring below this are dropped; none left => "I don't know" (no LLM call)

[llm]
provider = "claude"      # claude | ollama | echo (echo = offline test provider, no model)
system_prompt = """You answer questions using ONLY the numbered context passages provided.
Cite the passages you used like [1] or [2][3].
If the context does not contain the answer, say you don't know. Do not use outside knowledge."""

[llm.claude]
model = "claude-opus-5-5"
max_tokens = 2048
effort = "low"           # low | medium | high | xhigh | max  (key comes from ANTHROPIC_API_KEY in .env)

[llm.ollama]
model = "llama3.2"
host = "http://localhost:11434"
temperature = 0.2
